<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnav Nayak — Under Construction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0b0d10;
    color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(600px 400px at 20% 15%, rgba(88, 120, 255, 0.12), transparent 60%),
      radial-gradient(500px 380px at 85% 80%, rgba(0, 200, 170, 0.10), transparent 60%);
    animation: drift 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 2%, 0) scale(1.05); }
  }
  .wrap { text-align: center; padding: 2rem; position: relative; z-index: 1; max-width: 640px; }
  .name {
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #9aa0a6;
    margin-bottom: 2.5rem;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 1.25rem;
  }
  h1 .dot { color: #5b8cff; }
  p.sub {
    color: #9aa0a6;
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  .bar {
    width: 220px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    margin: 0 auto 2.5rem;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 3px;
    background: linear-gradient(90deg, #5b8cff, #00c8aa);
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(550%); }
  }
  .links { display: flex; gap: 1.75rem; justify-content: center; margin-bottom: 3rem; }
  .links a {
    color: #c7ccd4;
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid rgba(255,255,255,0.25);
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .links a:hover { color: #fff; border-color: #5b8cff; }
  footer { color: #5f6368; font-size: 0.8rem; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="name">Arnav Nayak</div>
    <h1>Under construction<span class="dot">.</span></h1>
    <p class="sub">The portfolio is being rebuilt from scratch.<br>Back soon — better than before.</p>
    <div class="bar"><span></span></div>
    <div class="links">
      <a href="https://github.com/arnavknayak">GitHub</a>
      <a href="mailto:arnav.nayakx@gmail.com">Email</a>
    </div>
    <footer>&copy; 2026 Arnav Nayak</footer>
  </div>
</body>
</html>
